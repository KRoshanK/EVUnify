<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EVUnify — Unified EV Charging India</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #052e16;
    --bg-mid: #064e3b;
    --card: #065f46;
    --card-soft: #047857;
    --accent: #34d399;
    --accent-bright: #6ee7b7;
    --text: #ecfdf5;
    --text-soft: #a7f3d0;
    --muted: #6ee7b7;
    --border: #047857;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(145deg, #052e16 0%, #064e3b 40%, #065f46 100%);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    background-image: 
      radial-gradient(circle at 20% 80%, rgba(52,211,153,0.12) 0%, transparent 40%),
      radial-gradient(circle at 80% 20%, rgba(16,185,129,0.1) 0%, transparent 35%);
  }
  header {
    height: 64px;
    background: rgba(5,46,22,0.92);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    border-bottom: 1px solid var(--border);
    z-index: 1000;
  }
  .logo {
    font-size: 24px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.4px;
  }
  .logo span { color: var(--accent-bright); font-weight: 600; }
  .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button, .btn {
    background: var(--accent);
    color: #052e16;
    border: none;
    padding: 8px 14px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: var(--accent-bright); }
  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.secondary:hover { background: rgba(52,211,153,0.15); }
  .wallet {
    background: rgba(52,211,153,0.15);
    color: var(--accent-bright);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid var(--border);
  }
  #map {
    height: calc(100vh - 64px - 290px);
    width: 100%;
  }
  .bottom-panel {
    height: 290px;
    background: rgba(5,46,22,0.95);
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  .filters {
    display: flex;
    gap: 8px;
    padding: 12px 14px;
    overflow-x: auto;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }
  .filter-chip {
    background: rgba(6,95,70,0.6);
    color: var(--text-soft);
    border: 1px solid var(--border);
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  .filter-chip.active {
    background: var(--accent);
    color: #052e16;
    border-color: var(--accent);
  }
  .station-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px;
  }
  .station-item {
    background: rgba(6,95,70,0.55);
    border-radius: 12px;
    padding: 13px;
    margin-bottom: 9px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .station-item:hover, .station-item.active {
    border-color: var(--accent);
    background: rgba(4,120,87,0.7);
  }
  .station-item h3 { font-size: 14px; margin-bottom: 4px; color: var(--text); }
  .meta { font-size: 12px; color: var(--text-soft); display: flex; gap: 10px; flex-wrap: wrap; }
  .network-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    color: #fff;
  }
  .popup-content { font-size: 13px; line-height: 1.5; color: var(--text); }
  .popup-content h3 { margin: 0 0 6px; color: var(--accent); }
  .status-available { color: var(--accent-bright); font-weight: 600; }
  .status-busy { color: #fbbf24; font-weight: 600; }
  .status-offline { color: #f87171; font-weight: 600; }
  .leaflet-popup-content-wrapper {
    background: #065f46;
    color: var(--text);
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  .leaflet-popup-tip { background: #065f46; }
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(5,46,22,0.75);
    z-index: 2000;
    align-items: center;
    justify-content: center;
  }
  .modal.open { display: flex; }
  .modal-card {
    background: #065f46;
    padding: 26px;
    border-radius: 18px;
    width: 90%;
    max-width: 420px;
    max-height: 80vh;
    overflow-y: auto;
    border: 1px solid var(--border);
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  }
  .modal-card h2 { margin-bottom: 12px; color: var(--accent); }
  .modal-card input {
    width: 100%;
    padding: 11px;
    margin: 8px 0;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #052e16;
    color: var(--text);
  }
  .note { font-size: 12px; color: var(--text-soft); margin-top: 8px; }
  .history-item {
    background: #052e16;
    padding: 11px;
    border-radius: 10px;
    margin-bottom: 8px;
    font-size: 13px;
    border: 1px solid var(--border);
  }
  @media (max-width: 600px) {
    #map { height: calc(100vh - 64px - 340px); }
    .bottom-panel { height: 340px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">EV<span>Unify</span></div>
  <div class="header-actions">
    <div class="wallet" id="walletDisplay" onclick="openWallet()">Wallet: ₹0</div>
    <button class="secondary" id="authBtn" onclick="openAuth()">Register / Login</button>
    <button class="secondary" onclick="centerOnUser()">📍 Near Me</button>
  </div>
</header>
<div id="map"></div>
<div class="bottom-panel">
  <div class="filters" id="filters"></div>
  <div class="station-list" id="stationList"></div>
</div>

<!-- Auth Modal -->
<div class="modal" id="authModal">
  <div class="modal-card">
    <h2>One Account for All Networks</h2>
    <p style="font-size:14px;margin-bottom:12px;color:var(--text-soft);">Register once. Charge and pay on every network with a single sustainable wallet.</p>
    <input id="userName" placeholder="Your name" />
    <input id="userPhone" placeholder="Mobile number" type="tel" />
    <button onclick="register()" style="width:100%;margin-top:10px;">Create Unified Account</button>
    <button class="secondary" onclick="closeAuth()" style="width:100%;margin-top:8px;">Cancel</button>
    <div class="note">Prototype simulation only.</div>
  </div>
</div>

<!-- Wallet / History Modal -->
<div class="modal" id="walletModal">
  <div class="modal-card">
    <h2>Unified Wallet</h2>
    <p>Balance: <strong id="walletBalance" style="color:var(--accent);">₹0</strong></p>
    <input id="addAmount" type="number" placeholder="Amount to add (₹)" min="100" step="100" value="500" />
    <button onclick="addMoney()" style="width:100%;margin-top:10px;">Add Money (UPI Simulation)</button>
    <h3 style="margin-top:16px;margin-bottom:8px;">Session History</h3>
    <div id="historyList"></div>
    <button class="secondary" onclick="closeWallet()" style="width:100%;margin-top:12px;">Close</button>
  </div>
</div>

<!-- Charge Modal -->
<div class="modal" id="chargeModal">
  <div class="modal-card">
    <h2 id="chargeTitle">Start Charging</h2>
    <p id="chargeDetails" style="color:var(--text-soft);"></p>
    <p style="margin:12px 0;">Estimated cost: <strong style="color:var(--accent);">₹45 – ₹80</strong></p>
    <button onclick="startCharge()" style="width:100%;">Pay & Start Charge</button>
    <button class="secondary" onclick="closeCharge()" style="width:100%;margin-top:8px;">Cancel</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const stations = [
  { id: 1, name: "Tata Power EZ Charge - BKC", lat: 19.066, lng: 72.869, network: "Tata Power", power: "60 kW DC", connectors: "CCS2", status: "Available", address: "Bandra Kurla Complex, Mumbai", deepLink: "https://www.tatapower.com" },
  { id: 2, name: "Statiq - Byculla Hub", lat: 18.975, lng: 72.832, network: "Statiq", power: "120 kW DC", connectors: "CCS2", status: "Available", address: "Byculla, Mumbai", deepLink: "https://statiq.in" },
  { id: 3, name: "MG e-Hub - Prabhadevi", lat: 19.014, lng: 72.827, network: "MG e-Hub", power: "50 kW DC", connectors: "CCS2", status: "Busy", address: "Prabhadevi, Mumbai", deepLink: "https://www.mgmotor.co.in" },
  { id: 4, name: "Jio-bp Pulse - Worli", lat: 19.017, lng: 72.815, network: "Jio-bp", power: "60 kW DC", connectors: "CCS2", status: "Available", address: "Worli, Mumbai", deepLink: "https://www.jiobp.com" },
  { id: 5, name: "Charge_iN Mahindra - Andheri", lat: 19.113, lng: 72.869, network: "Charge_iN", power: "100 kW DC", connectors: "CCS2", status: "Available", address: "Andheri East, Mumbai", deepLink: "https://www.mahindra.com" },
  { id: 6, name: "Maruti e for me - Borivali", lat: 19.229, lng: 72.857, network: "e for me", power: "22 kW AC", connectors: "Type 2", status: "Available", address: "Borivali, Mumbai", deepLink: "https://www.marutisuzuki.com" },
  { id: 7, name: "Tata Power - RK Puram", lat: 28.560, lng: 77.182, network: "Tata Power", power: "50 kW DC", connectors: "CCS2", status: "Available", address: "RK Puram, New Delhi", deepLink: "https://www.tatapower.com" },
  { id: 8, name: "Pacific Mall Pitampura", lat: 28.693, lng: 77.131, network: "Tata Power", power: "60 kW DC", connectors: "CCS2", status: "Busy", address: "Pitampura, Delhi", deepLink: "https://www.tatapower.com" },
  { id: 9, name: "Jio-bp Pulse Dwarka", lat: 28.592, lng: 77.046, network: "Jio-bp", power: "120 kW DC", connectors: "CCS2", status: "Available", address: "Dwarka Sector 13, Delhi", deepLink: "https://www.jiobp.com" },
  { id: 10, name: "ChargeZone - Gurugram", lat: 28.459, lng: 77.026, network: "ChargeZone", power: "150 kW DC", connectors: "CCS2", status: "Available", address: "Gurugram, Haryana", deepLink: "https://www.chargezone.co.in" },
  { id: 11, name: "BESCOM Corporate Office", lat: 12.976, lng: 77.599, network: "BESCOM", power: "50 kW DC", connectors: "CCS2", status: "Available", address: "Bengaluru", deepLink: "#" },
  { id: 12, name: "Tata Power - Begur", lat: 12.872, lng: 77.632, network: "Tata Power", power: "60 kW DC", connectors: "CCS2", status: "Available", address: "Begur, Bengaluru", deepLink: "https://www.tatapower.com" },
  { id: 13, name: "Statiq - Electronic City", lat: 12.845, lng: 77.660, network: "Statiq", power: "120 kW DC", connectors: "CCS2", status: "Offline", address: "Electronic City, Bengaluru", deepLink: "https://statiq.in" },
  { id: 14, name: "MG e-Hub - Whitefield", lat: 12.969, lng: 77.750, network: "MG e-Hub", power: "50 kW DC", connectors: "CCS2", status: "Available", address: "Whitefield, Bengaluru", deepLink: "https://www.mgmotor.co.in" },
  { id: 15, name: "Tata Power - Hinjewadi", lat: 18.591, lng: 73.738, network: "Tata Power", power: "60 kW DC", connectors: "CCS2", status: "Available", address: "Hinjewadi, Pune", deepLink: "https://www.tatapower.com" },
  { id: 16, name: "Charge_iN - Kothrud", lat: 18.507, lng: 73.807, network: "Charge_iN", power: "100 kW DC", connectors: "CCS2", status: "Available", address: "Kothrud, Pune", deepLink: "https://www.mahindra.com" }
];

const networks = ["All", "Tata Power", "Statiq", "MG e-Hub", "Charge_iN", "Jio-bp", "ChargeZone", "e for me", "BESCOM"];
const networkColors = {
  "Tata Power": "#ef4444", "Statiq": "#a78bfa", "MG e-Hub": "#60a5fa",
  "Charge_iN": "#fb923c", "Jio-bp": "#38bdf8", "ChargeZone": "#fbbf24",
  "e for me": "#3b82f6", "BESCOM": "#94a3b8"
};

let map, markers = [], activeFilter = "All";
let user = null;
let wallet = 0;
let sessions = [];
let currentStation = null;

function initMap() {
  map = L.map('map').setView([19.076, 72.877], 11);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    subdomains: 'abcd',
    maxZoom: 20
  }).addTo(map);
  renderFilters();
  renderStations();
  updateWallet();
  renderHistory();
}

function renderFilters() {
  document.getElementById('filters').innerHTML = networks.map(n =>
    `<button class="filter-chip ${n === activeFilter ? 'active' : ''}" onclick="setFilter('${n}')">${n}</button>`
  ).join('');
}

function setFilter(network) {
  activeFilter = network;
  renderFilters();
  renderStations();
}

function getColor(network) { return networkColors[network] || "#94a3b8"; }

function renderStations() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  const filtered = activeFilter === "All" ? stations : stations.filter(s => s.network === activeFilter);
  filtered.forEach(s => {
    const marker = L.circleMarker([s.lat, s.lng], {
      radius: 9, fillColor: getColor(s.network), color: "#ecfdf5", weight: 2, fillOpacity: 0.95
    }).addTo(map);
    marker.bindPopup(buildPopup(s));
    markers.push(marker);
  });
  if (filtered.length) map.fitBounds(L.featureGroup(markers).getBounds().pad(0.2));

  document.getElementById('stationList').innerHTML = filtered.map(s => `
    <div class="station-item" onclick="focusStation(${s.id})">
      <h3>${s.name}</h3>
      <div class="meta">
        <span class="network-badge" style="background:${getColor(s.network)}">${s.network}</span>
        <span>${s.power}</span>
        <span>${s.connectors}</span>
        <span class="${s.status === 'Available' ? 'status-available' : ''}">${s.status}</span>
      </div>
    </div>
  `).join('') || '<div style="padding:20px;text-align:center;color:var(--text-soft)">No stations</div>';
}

function buildPopup(s) {
  const statusClass = s.status === "Available" ? "status-available" : s.status === "Busy" ? "status-busy" : "status-offline";
  return `
    <div class="popup-content">
      <h3>${s.name}</h3>
      <div><strong>${s.network}</strong> • ${s.power}</div>
      <div>Connector: ${s.connectors}</div>
      <div class="${statusClass}">● ${s.status}</div>
      <div style="margin:6px 0;font-size:12px;color:var(--text-soft)">${s.address}</div>
      <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;">
        <a href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}" target="_blank"
           style="background:#34d399;color:#052e16;padding:6px 10px;border-radius:8px;text-decoration:none;font-size:12px;font-weight:700;">Navigate</a>
        <button onclick="openCharge(${s.id})" style="background:#34d399;color:#052e16;border:none;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;">Charge & Pay</button>
        <a href="${s.deepLink}" target="_blank" style="background:transparent;color:var(--text);padding:6px 10px;border-radius:8px;text-decoration:none;font-size:12px;border:1px solid var(--border);">Operator App</a>
      </div>
    </div>`;
}

function focusStation(id) {
  const s = stations.find(st => st.id === id);
  if (!s) return;
  map.setView([s.lat, s.lng], 15);
}

function centerOnUser() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      map.setView([pos.coords.latitude, pos.coords.longitude], 13);
    });
  }
}

function openAuth() { document.getElementById('authModal').classList.add('open'); }
function closeAuth() { document.getElementById('authModal').classList.remove('open'); }

function register() {
  const name = document.getElementById('userName').value || "EV Driver";
  user = { name };
  wallet = 500;
  sessions = [];
  updateWallet();
  document.getElementById('authBtn').textContent = "Hi, " + name.split(" ")[0];
  closeAuth();
  alert("Unified account created!\nCharge and pay on any network with one wallet.");
}

function updateWallet() {
  document.getElementById('walletDisplay').textContent = `Wallet: ₹${wallet}`;
  const bal = document.getElementById('walletBalance');
  if (bal) bal.textContent = `₹${wallet}`;
}

function openWallet() {
  if (!user) { alert("Please register first."); openAuth(); return; }
  document.getElementById('walletModal').classList.add('open');
  renderHistory();
}
function closeWallet() { document.getElementById('walletModal').classList.remove('open'); }

function addMoney() {
  const amt = parseInt(document.getElementById('addAmount').value) || 0;
  if (amt < 100) { alert("Minimum ₹100"); return; }
  wallet += amt;
  sessions.unshift({ type: "Top-up", amount: amt, time: new Date().toLocaleString(), detail: "UPI Simulation" });
  updateWallet();
  renderHistory();
  alert(`₹${amt} added to wallet.`);
}

function renderHistory() {
  const list = document.getElementById('historyList');
  if (!list) return;
  list.innerHTML = sessions.length ? sessions.map(s => `
    <div class="history-item">
      <strong>${s.type}</strong> • ₹${s.amount} • ${s.time}<br>
      <span style="color:var(--text-soft)">${s.detail}</span>
    </div>
  `).join('') : '<div style="color:var(--text-soft);font-size:13px;">No sessions yet</div>';
}

function openCharge(id) {
  if (!user) { alert("Please register / login once."); openAuth(); return; }
  currentStation = stations.find(s => s.id === id);
  document.getElementById('chargeTitle').textContent = "Charge at " + currentStation.name;
  document.getElementById('chargeDetails').innerHTML = `${currentStation.network} • ${currentStation.power}<br>${currentStation.address}`;
  document.getElementById('chargeModal').classList.add('open');
}
function closeCharge() { document.getElementById('chargeModal').classList.remove('open'); }

function startCharge() {
  const cost = Math.floor(Math.random() * 40) + 40;
  if (wallet < cost) { alert("Insufficient balance. Add money first."); openWallet(); return; }
  wallet -= cost;
  sessions.unshift({
    type: "Charging",
    amount: -cost,
    time: new Date().toLocaleString(),
    detail: `${currentStation.name} (${currentStation.network})`
  });
  updateWallet();
  renderHistory();
  closeCharge();
  alert(`Charging started at ${currentStation.name}!\n₹${cost} deducted from your wallet.`);
}

initMap();
</script>
</body>
</html>
